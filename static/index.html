<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wiki-speedrun — trace a path between two articles</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='49' font-family='Georgia,serif' font-size='48' font-weight='bold' text-anchor='middle' fill='%23baff48'%3EW%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090909;
  --panel: #101010;
  --line: #292929;
  --line2: #4a4a4a;
  --text: #e6e6df;
  --muted: #85857d;
  --acid: #baff48;
  --acid-glow: rgba(186,255,72,.4);
  --error: #ff625f;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  padding-bottom: 5rem;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .55;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size: 56px 56px;
  mask-image: linear-gradient(#000,transparent 85%);
  animation: gridScroll 20s linear infinite;
}

@keyframes gridScroll {
  to { background-position: 0 56px; }
}

header {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: auto;
  padding: 4.7rem 1.4rem 3rem;
  border-bottom: 1px solid var(--line);
}

.kicker {
  font-size: .66rem;
  letter-spacing: .14em;
  color: var(--acid);
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.kicker::before {
  content: "// ";
  color: var(--muted);
}

h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(4rem,10vw,8rem);
  font-weight: 700;
  letter-spacing: -.055em;
  line-height: .85;
  margin: 0;
  text-transform: lowercase;
}

h1:hover {
  text-shadow: 0 0 15px rgba(186,255,72,.3);
}

header p {
  max-width: 39rem;
  margin: 1.7rem 0 0;
  color: var(--muted);
  font-size: .78rem;
  line-height: 1.75;
}

.panel-wrap {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: auto;
  padding: 2rem 1.4rem 0;
}

.panel {
  position: relative;
  width: 100%;
  max-width: 780px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 2rem;
}

.panel:hover {
  border-color: #383838;
  box-shadow: 0 0 20px rgba(0,0,0,.5);
}

.panel::before {
  content: "PATH_QUERY / 01";
  position: absolute;
  right: 1rem;
  top: 1rem;
  color: #3f3f3b;
  font-size: .58rem;
  letter-spacing: .08em;
}

.field {
  position: relative;
  margin-bottom: 1.45rem;
}

.field-label {
  display: block;
  font-size: .62rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .55rem;
}

.field input {
  width: 100%;
  padding: .75rem 0;
  border: 0;
  border-bottom: 1px solid var(--line2);
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: .95rem;
}

.field input:focus {
  border-bottom-color: var(--acid);
  box-shadow: 0 2px 8px -2px var(--acid-glow);
}

.field input::placeholder { color: #50504a; }

.swap-row {
  display: flex;
  align-items: center;
  gap: .8rem;
  margin: .15rem 0 1.45rem;
}

.swap-row hr {
  flex: 1;
  border: 0;
  border-top: 1px solid var(--line);
}

.swap-btn {
  background: transparent;
  border: 1px solid var(--line2);
  color: var(--muted);
  border-radius: 0;
  padding: .35rem .65rem;
  font-family: inherit;
  font-size: .62rem;
  cursor: pointer;
}

.swap-btn:hover {
  color: var(--acid);
  border-color: var(--acid);
}

.suggest {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  display: none;
  z-index: 20;
  max-height: 220px;
  overflow: auto;
  background: #111;
  border: 1px solid var(--line2);
  box-shadow: 0 10px 25px rgba(0,0,0,.5);
}

.suggest.open { display: block; }

.suggest div {
  padding: .6rem .75rem;
  color: var(--muted);
  font-size: .76rem;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
}

.suggest div:hover,
.suggest div.active {
  color: var(--acid);
  background: #171717;
}

.go-btn {
  position: relative;
  overflow: hidden;
  width: 100%;
  background: var(--acid);
  color: #080808;
  border: 0;
  border-radius: 0;
  padding: .95rem 1rem;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 600;
}

.go-btn::before { content: "[ RUN ]  "; }

.go-btn:hover {
  background: #d2ff8b;
  box-shadow: 0 0 15px var(--acid-glow);
}

.go-btn:disabled {
  opacity: .35;
  cursor: default;
}

.status {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  min-height: 1.5rem;
  margin: 1.25rem auto 0;
  padding: 0 1.4rem;
  color: var(--muted);
  font-size: .7rem;
}

.status::before {
  content: "> ";
  color: #555;
}

.status.error { color: var(--error); }

.status.loading::after {
  content: "█";
  animation: blink .8s infinite;
  margin-left: 4px;
  color: var(--acid);
}

@keyframes blink {
  50% { opacity: 0; }
}

.board {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 3.8rem auto 0;
  padding: 0 1.4rem;
}

.stat-bar {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  padding-bottom: .9rem;
  margin-bottom: 1.4rem;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: .65rem;
}

.stat-bar b {
  color: var(--text);
  font-weight: 500;
}

.path-row {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2rem 0;
  padding: 1.3rem 0;
  margin-bottom: 1.2rem;
  border-bottom: 1px solid var(--line);
}

.path-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.path-svg path.trace-base {
  fill: none;
  stroke: #303030;
  stroke-width: 1;
  stroke-dasharray: 4 5;
}

.path-svg path.trace-live {
  fill: none;
  stroke: var(--acid);
  stroke-width: 2;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--acid-glow));
}

.path-svg circle {
  fill: var(--acid);
  filter: drop-shadow(0 0 4px var(--acid));
}

.node {
  position: relative;
  z-index: 1;
  width: 190px;
  min-height: 120px;
  flex: 0 0 auto;
  margin-right: 2rem;
  padding: 1.45rem .9rem .85rem;
  background: var(--panel);
  border: 1px solid var(--line);
  opacity: 0;
  transform: translateY(15px) scale(.96);
  transition:
    opacity .35s ease,
    transform .35s ease,
    border-color .2s,
    box-shadow .2s;
}

.node.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  border-color: #4b4b45;
}

.node:hover {
  border-color: var(--acid);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.4);
}

.node .pad {
  position: absolute;
  top: -3px;
  left: 12px;
  width: 6px;
  height: 6px;
  background: var(--acid);
  box-shadow: 0 0 8px var(--acid);
  animation: pulsePad 2s infinite ease-in-out;
}

@keyframes pulsePad {
  50% { transform: scale(1.4); opacity: .6; }
}

.node .hopnum {
  position: absolute;
  top: .55rem;
  right: .65rem;
  color: #555;
  font-size: .58rem;
}

.node .title {
  font-weight: 500;
  font-size: .8rem;
  line-height: 1.5;
  color: var(--text);
  overflow-wrap: anywhere;
}

.node .tag {
  display: inline-block;
  margin-top: .7rem;
  color: var(--acid);
  font-size: .56rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.node a {
  position: absolute;
  inset: 0;
  display: block;
}

.more-paths-btn {
  display: block;
  width: 100%;
  margin-top: 1.2rem;
  padding: .9rem 1rem;
  background: transparent;
  border: 1px solid var(--acid);
  color: var(--acid);
  font: 600 .72rem 'IBM Plex Mono',monospace;
  letter-spacing: .08em;
  cursor: pointer;
}

.more-paths-btn:hover {
  background: var(--acid);
  color: #080808;
}

.more-paths-btn:disabled {
  opacity: .55;
  cursor: wait;
}

.more-paths-btn[hidden] { display: none; }

footer {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 4rem auto 0;
  padding: 1rem 1.4rem 0;
  border-top: 1px solid var(--line);
  color: #55554f;
  font-size: .6rem;
}

@media(max-width:700px) {
  header { padding-top: 3.2rem; }
  .panel { padding: 1.4rem; }
  .node {
    width: calc(50% - 1rem);
    margin-right: 1rem;
  }
}

@media(max-width:480px) {
  .node {
    width: 100%;
    margin-right: 0;
  }
}

@media(prefers-reduced-motion:reduce) {
  .node, body::before, .path-svg circle, .node .pad {
    transition: none;
    animation: none;
  }
}
</style>
</head>
<body>

<header>
  <div class="kicker">Best way to speedrun wikipedia</div>
  <h1>Wiki&#8209;speedrun</h1>
  <p>Go from one Wikipedia page to another through hyperlinks at super speed!</p>
</header>

<div class="panel-wrap">
  <div class="panel">
    <div class="field">
      <span class="field-label">Start node</span>
      <input id="start" type="text"
             placeholder="e.g. Duct tape" autocomplete="off">
      <div class="suggest" id="suggest-start"></div>
    </div>

    <div class="swap-row">
      <hr>
      <button class="swap-btn" id="swap"
              title="Swap start and goal">&#8645; SWAP</button>
      <hr>
    </div>

    <div class="field">
      <span class="field-label">Destination node</span>
      <input id="goal" type="text"
             placeholder="e.g. Genghis Khan" autocomplete="off">
      <div class="suggest" id="suggest-goal"></div>
    </div>

    <button class="go-btn" id="go">Trace route</button>
  </div>
</div>

<div class="status" id="status"></div>

<div class="board" id="board" style="display:none">
  <div class="stat-bar" id="statbar"></div>
  <div id="path-list" aria-live="polite"></div>
  <button class="more-paths-btn" id="more-paths" hidden>
    MORE PATHS +6
  </button>
</div>

<footer>// graph resident in memory / queries served from RAM</footer>

<script>
const API = "https://supervision-hampton-twiki-singles.trycloudflare.com";

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function wireSuggest(inputId, boxId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);
  let items = [];
  let activeIdx = -1;

  function render() {
    box.replaceChildren();

    items.forEach((title, index) => {
      const item = document.createElement("div");
      item.textContent = title;

      if (index === activeIdx) item.classList.add("active");

      item.addEventListener("mousedown", event => {
        event.preventDefault();
        input.value = title;
        box.classList.remove("open");
      });

      box.appendChild(item);
    });

    box.classList.toggle("open", items.length > 0);
  }

  const fetchSuggest = debounce(async () => {
    const query = input.value.trim();

    if (!query) {
      items = [];
      render();
      return;
    }

    try {
      const response = await fetch(
        `${API}/api/suggest?q=${encodeURIComponent(query)}&limit=8`
      );

      if (!response.ok) throw new Error("Suggestion request failed");

      items = await response.json();
      activeIdx = -1;
      render();
    } catch (error) {
      items = [];
      render();
    }
  }, 150);

  input.addEventListener("input", fetchSuggest);

  input.addEventListener("blur", () => {
    setTimeout(() => box.classList.remove("open"), 100);
  });

  input.addEventListener("keydown", event => {
    if (!box.classList.contains("open")) {
      if (event.key === "Enter") runSearch();
      return;
    }

    if (event.key === "ArrowDown") {
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      render();
      event.preventDefault();
    } else if (event.key === "ArrowUp") {
      activeIdx = Math.max(activeIdx - 1, 0);
      render();
      event.preventDefault();
    } else if (event.key === "Enter" && activeIdx >= 0) {
      input.value = items[activeIdx];
      box.classList.remove("open");
      event.preventDefault();
    } else if (event.key === "Escape") {
      box.classList.remove("open");
    }
  });
}

wireSuggest("start", "suggest-start");
wireSuggest("goal", "suggest-goal");

document.getElementById("swap").addEventListener("click", () => {
  const start = document.getElementById("start");
  const goal = document.getElementById("goal");

  [start.value, goal.value] = [goal.value, start.value];
});

const statusEl = document.getElementById("status");
const board = document.getElementById("board");
const statbar = document.getElementById("statbar");
const pathList = document.getElementById("path-list");
const moreBtn = document.getElementById("more-paths");
const goBtn = document.getElementById("go");

let cachedPaths = [];
let nextCachedPath = 1;
let loadingMore = false;
let searchGeneration = 0;

function wikiUrl(title) {
  return "https://en.wikipedia.org/wiki/" +
    encodeURIComponent(title.replace(/ /g, "_"));
}

function svgElement(name, attributes = {}) {
  const element = document.createElementNS(
    "http://www.w3.org/2000/svg",
    name
  );

  for (const [key, value] of Object.entries(attributes)) {
    element.setAttribute(key, value);
  }

  return element;
}

/*
 * Recalculate connectors using the actual position and dimensions of
 * every box. This works after wrapping, resizing, and adding paths.
 */
function drawPath(row) {
  const svg = row.querySelector(".path-svg");
  const nodes = [...row.querySelectorAll(".node")];

  if (!svg || nodes.length === 0) return;

  const rowRect = row.getBoundingClientRect();
  const width = row.clientWidth;
  const height = row.clientHeight;

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.replaceChildren();

  const boxes = nodes.map(node => {
    const rect = node.getBoundingClientRect();

    return {
      left: rect.left - rowRect.left,
      right: rect.right - rowRect.left,
      top: rect.top - rowRect.top,
      bottom: rect.bottom - rowRect.top,
      x: rect.left - rowRect.left + rect.width / 2,
      y: rect.top - rowRect.top + rect.height / 2,
      width: rect.width,
      height: rect.height
    };
  });

  for (let i = 0; i < boxes.length - 1; i++) {
    const a = boxes[i];
    const b = boxes[i + 1];

    /*
     * Choose the nearest edges based on the actual direction between
     * the boxes. Horizontal layout uses left/right edges; wrapped
     * layout uses top/bottom edges.
     */
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const horizontal = Math.abs(dx) >= Math.abs(dy);

    let x1, y1, x2, y2;

    if (horizontal) {
      const direction = Math.sign(dx || 1);

      x1 = a.x + direction * a.width / 2;
      y1 = a.y;
      x2 = b.x - direction * b.width / 2;
      y2 = b.y;
    } else {
      const direction = Math.sign(dy || 1);

      x1 = a.x;
      y1 = a.y + direction * a.height / 2;
      x2 = b.x;
      y2 = b.y - direction * b.height / 2;
    }

    const d = `M ${x1} ${y1} L ${x2} ${y2}`;

    svg.appendChild(svgElement("path", {
      d,
      class: "trace-base"
    }));

    svg.appendChild(svgElement("path", {
      d,
      class: "trace-live"
    }));
  }

  boxes.forEach(box => {
    svg.appendChild(svgElement("circle", {
      cx: box.x,
      cy: box.y,
      r: 3.5
    }));
  });
}

let redrawPending = false;

function scheduleRedraw() {
  if (redrawPending) return;

  redrawPending = true;

  requestAnimationFrame(() => {
    redrawPending = false;

    document.querySelectorAll(".path-row").forEach(drawPath);
  });
}

/*
 * ResizeObserver handles layout changes; window events handle
 * viewport changes. Font loading can also change box dimensions.
 */
if ("ResizeObserver" in window) {
  const observer = new ResizeObserver(scheduleRedraw);

  observer.observe(document.documentElement);
  observer.observe(pathList);
}

window.addEventListener("resize", scheduleRedraw, { passive: true });
window.addEventListener("orientationchange", scheduleRedraw);

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(scheduleRedraw);
}

function renderPath(path, index) {
  const row = document.createElement("div");
  row.className = "path-row";
  row.dataset.pathIndex = index;

  const svg = svgElement("svg", {
    class: "path-svg",
    "aria-hidden": "true"
  });

  row.appendChild(svg);

  path.forEach((title, i) => {
    const node = document.createElement("div");
    node.className = "node";

    const cleanTitle = String(title).replace(/_/g, " ");
    const tag = i === 0
      ? "start"
      : i === path.length - 1
        ? "destination"
        : `hop ${i}`;

    const pad = document.createElement("div");
    pad.className = "pad";

    const hopNumber = document.createElement("div");
    hopNumber.className = "hopnum";
    hopNumber.textContent = String(i).padStart(2, "0");

    const titleElement = document.createElement("div");
    titleElement.className = "title";
    titleElement.textContent = cleanTitle;

    const tagElement = document.createElement("div");
    tagElement.className = "tag";
    tagElement.textContent = tag;

    const link = document.createElement("a");
    link.href = wikiUrl(title);
    link.target = "_blank";
    link.rel = "noopener";
    link.setAttribute(
      "aria-label",
      `Open ${cleanTitle} on Wikipedia`
    );

    node.append(pad, hopNumber, titleElement, tagElement, link);
    row.appendChild(node);
  });

  pathList.appendChild(row);

  const nodes = [...row.querySelectorAll(".node")];

  nodes.forEach((node, i) => {
    setTimeout(() => {
      node.classList.add("show");
      drawPath(row);
    }, i * 65);
  });

  setTimeout(() => drawPath(row), nodes.length * 65 + 100);
}
function updateMoreButton() {
  const remaining = Math.max(0, cachedPaths.length - nextCachedPath);

  moreBtn.hidden = remaining === 0;
  moreBtn.disabled = loadingMore;

  moreBtn.textContent = loadingMore
    ? "LOADING PATHS..."
    : `MORE PATHS +${Math.min(6, remaining)}`;
}

/*
 * No API request here. The initial search already fetched all returned
 * paths, so this function only reveals the next batch of cached paths.
 */
function loadMorePaths() {
  if (loadingMore) return;

  const remaining = cachedPaths.length - nextCachedPath;

  if (remaining <= 0) {
    updateMoreButton();
    return;
  }

  loadingMore = true;
  updateMoreButton();

  const end = Math.min(nextCachedPath + 6, cachedPaths.length);
  const batch = cachedPaths.slice(nextCachedPath, end);

  batch.forEach((path, index) => {
    renderPath(path, nextCachedPath + index);
  });

  nextCachedPath = end;
  loadingMore = false;

  updateMoreButton();
  scheduleRedraw();

  statusEl.className = "status";
  statusEl.textContent =
    `Showing ${batch.length} additional path${batch.length === 1 ? "" : "s"}.`;
}

async function runSearch() {
  const start = document.getElementById("start").value.trim();
  const goal = document.getElementById("goal").value.trim();

  if (!start || !goal) {
    statusEl.textContent =
      "Enter both a start and a destination article.";
    statusEl.className = "status error";
    return;
  }

  const generation = ++searchGeneration;

  goBtn.disabled = true;
  moreBtn.hidden = true;
  board.style.display = "none";

  statusEl.className = "status loading";
  statusEl.textContent = "Querying the archive...";

  try {
    const response = await fetch(
      `${API}/api/search?start=${encodeURIComponent(start)}` +
      `&goal=${encodeURIComponent(goal)}`
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    // Ignore stale results if another search was started.
    if (generation !== searchGeneration) return;

    if (!data.start_found) {
      statusEl.className = "status error";
      statusEl.textContent = `NODE NOT FOUND: "${start}"`;
      return;
    }

    if (!data.goal_found) {
      statusEl.className = "status error";
      statusEl.textContent = `NODE NOT FOUND: "${goal}"`;
      return;
    }

    if (!data.reachable) {
      statusEl.className = "status error";
      statusEl.textContent =
        "NO CIRCUIT: no hyperlink path found between those articles.";
      return;
    }

    let note = "";

    if (data.start_redirected_from) {
      note += `"${data.start_redirected_from}" redirects to ` +
        `"${data.start_canonical}". `;
    }

    if (data.goal_redirected_from) {
      note += `"${data.goal_redirected_from}" redirects to ` +
        `"${data.goal_canonical}". `;
    }

    statusEl.className = "status";
    statusEl.textContent = note;

    statbar.replaceChildren();

    const hops = document.createElement("span");
    hops.append("HOPS ");

    const hopsValue = document.createElement("b");
    hopsValue.textContent = data.hops;
    hops.appendChild(hopsValue);

    const lookup = document.createElement("span");
    lookup.append("LOOKUP ");

    const lookupValue = document.createElement("b");
    lookupValue.textContent = `${Number(data.ms).toFixed(2)} ms`;
    lookup.appendChild(lookupValue);

    statbar.append(hops, lookup);

    pathList.replaceChildren();

    /*
     * Expected backend format:
     * {
     *   "path": ["Cat", "...", "Dog"],
     *   "paths": [
     *     ["Cat", "...", "Dog"],
     *     ["Cat", "...", "Dog"],
     *     ...
     *   ]
     * }
     *
     * The first path is displayed immediately. Other returned paths
     * remain in memory until the user clicks MORE PATHS.
     */
    const returnedPaths = Array.isArray(data.paths)
      ? data.paths
      : [data.path];

    cachedPaths = [];

    for (const path of returnedPaths) {
      if (!Array.isArray(path) || path.length === 0) continue;

      const duplicate = cachedPaths.some(existing =>
        JSON.stringify(existing) === JSON.stringify(path)
      );

      if (!duplicate) {
        cachedPaths.push(path);
      }
    }

    if (cachedPaths.length === 0 && Array.isArray(data.path)) {
      cachedPaths = [data.path];
    }

    nextCachedPath = 1;

    board.style.display = "block";

    if (cachedPaths.length > 0) {
      renderPath(cachedPaths[0], 0);
    }

    updateMoreButton();
    scheduleRedraw();

  } catch (error) {
    if (generation === searchGeneration) {
      statusEl.className = "status error";
      statusEl.textContent =
        "LINK DOWN: couldn't reach the server.";
    }
  } finally {
    if (generation === searchGeneration) {
      goBtn.disabled = false;
    }
  }
}

moreBtn.addEventListener("click", loadMorePaths);
goBtn.addEventListener("click", runSearch);
</script>
</body>
</html>
